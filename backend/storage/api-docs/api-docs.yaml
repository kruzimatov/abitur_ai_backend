openapi: 3.0.3
info:
  title: AbiturAI API
  description: AI-powered DTM test prep platform for Uzbek students
  version: 1.0.0

servers:
  - url: http://localhost:8080/api
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AuthResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string }
        token_type: { type: string, example: bearer }
        expires_in: { type: integer, example: 3600 }

    Subject:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        icon: { type: string, nullable: true }
        description: { type: string, nullable: true }
        topics_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Topic:
      type: object
      properties:
        id: { type: integer }
        subject_id: { type: integer }
        title: { type: string }
        content: { type: string }
        order_num: { type: integer }
        subject:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }

    TopicShort:
      type: object
      properties:
        id: { type: integer }
        subject_id: { type: integer }
        title: { type: string }
        order_num: { type: integer }

    Question:
      type: object
      properties:
        id: { type: integer }
        topic_id: { type: integer }
        question_text: { type: string }
        option_a: { type: string }
        option_b: { type: string }
        option_c: { type: string }
        option_d: { type: string }
        correct_answer: { type: string, enum: [A, B, C, D] }
        explanation: { type: string, nullable: true }

    QuestionForQuiz:
      type: object
      properties:
        id: { type: integer }
        question_text: { type: string }
        option_a: { type: string }
        option_b: { type: string }
        option_c: { type: string }
        option_d: { type: string }

    QuizAttempt:
      type: object
      properties:
        id: { type: integer }
        topic_id: { type: integer }
        score: { type: integer }
        total: { type: integer }
        diagnosis: { type: array, nullable: true, items: { $ref: '#/components/schemas/DiagnosisItem' } }
        completed_at: { type: string, format: date-time, nullable: true }
        topic:
          type: object
          properties:
            id: { type: integer }
            title: { type: string }

    DiagnosisItem:
      type: object
      properties:
        question: { type: string }
        student_answer: { type: string }
        correct_answer: { type: string }
        misconception: { type: string }
        why_student_chose: { type: string }
        correct_reasoning: { type: string }
        tip: { type: string }

    FeynmanResult:
      type: object
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        correct: { type: array, items: { type: string } }
        wrong: { type: array, items: { type: string } }
        missing: { type: array, items: { type: string } }
        feedback: { type: string }

    TutorResponse:
      type: object
      properties:
        answer: { type: string }
        sources: { type: array, items: { type: string } }

    StudentDashboard:
      type: object
      properties:
        total_quizzes: { type: integer }
        avg_score: { type: number }
        subjects_count: { type: integer }
        recent_attempts: { type: array, items: { $ref: '#/components/schemas/QuizAttempt' } }

    AdminDashboard:
      type: object
      properties:
        total_users: { type: integer }
        total_subjects: { type: integer }
        total_topics: { type: integer }
        total_questions: { type: integer }
        total_quiz_attempts: { type: integer }

    Error:
      type: object
      properties:
        message: { type: string }

    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

paths:
  # ════════════════════════════════════════
  # AUTH
  # ════════════════════════════════════════
  /auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, example: "Ali Valiyev" }
                email: { type: string, example: "ali@example.com" }
                password: { type: string, minLength: 6, example: "password123" }
                password_confirmation: { type: string, example: "password123" }
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '422':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: "ali@example.com" }
                password: { type: string, example: "password123" }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '422':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (invalidate token)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Successfully logged out" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh JWT token
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: New token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }

  /user:
    get:
      tags: [Auth]
      summary: Get current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  # ════════════════════════════════════════
  # DASHBOARD
  # ════════════════════════════════════════
  /dashboard/student:
    get:
      tags: [Dashboard]
      summary: Student dashboard stats
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Student stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentDashboard' }

  /dashboard/admin:
    get:
      tags: [Dashboard]
      summary: Admin dashboard stats
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Admin overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDashboard' }

  # ════════════════════════════════════════
  # SUBJECTS
  # ════════════════════════════════════════
  /subjects:
    get:
      tags: [Subjects]
      summary: List all subjects
      description: "Used by: Student (subject list page), Admin (manage subjects)"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of subjects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Subject' }
    post:
      tags: [Subjects]
      summary: Create subject (admin/teacher)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "Fizika" }
                icon: { type: string, example: "⚡" }
                description: { type: string, example: "DTM fizika fani" }
      responses:
        '201':
          description: Subject created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subject' }

  /subjects/{id}:
    put:
      tags: [Subjects]
      summary: Update subject (admin/teacher)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                icon: { type: string }
                description: { type: string }
      responses:
        '200':
          description: Subject updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subject' }
    delete:
      tags: [Subjects]
      summary: Delete subject (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Subject deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /subjects/{id}/topics:
    get:
      tags: [Subjects]
      summary: List topics in a subject
      description: "Used by: Student (topic list page)"
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Topics list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TopicShort' }

  # ════════════════════════════════════════
  # TOPICS
  # ════════════════════════════════════════
  /topics/{id}:
    get:
      tags: [Topics]
      summary: Get topic content (darslik page)
      description: "Used by: Student (lesson content page)"
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Topic with content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
    put:
      tags: [Topics]
      summary: Update topic (admin/teacher)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject_id: { type: integer }
                title: { type: string }
                content: { type: string }
                order_num: { type: integer }
      responses:
        '200':
          description: Topic updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
    delete:
      tags: [Topics]
      summary: Delete topic (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Topic deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /topics:
    post:
      tags: [Topics]
      summary: Create topic (admin/teacher)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_id, title, content]
              properties:
                subject_id: { type: integer, example: 1 }
                title: { type: string, example: "Integrallar" }
                content: { type: string, example: "Integral - hosilaning teskari amali..." }
                order_num: { type: integer, example: 4 }
      responses:
        '201':
          description: Topic created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }

  # ════════════════════════════════════════
  # QUESTIONS (Admin/Teacher CRUD)
  # ════════════════════════════════════════
  /questions:
    get:
      tags: [Questions]
      summary: List questions (paginated, filterable)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: topic_id
          in: query
          schema: { type: integer }
          description: Filter by topic
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: Paginated questions
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_page: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Question' }
                  last_page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
    post:
      tags: [Questions]
      summary: Create question (admin/teacher)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic_id, question_text, option_a, option_b, option_c, option_d, correct_answer]
              properties:
                topic_id: { type: integer, example: 1 }
                question_text: { type: string, example: "log_2(16) = ?" }
                option_a: { type: string, example: "2" }
                option_b: { type: string, example: "3" }
                option_c: { type: string, example: "4" }
                option_d: { type: string, example: "8" }
                correct_answer: { type: string, enum: [A, B, C, D], example: "C" }
                explanation: { type: string, example: "2^4 = 16" }
      responses:
        '201':
          description: Question created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }

  /questions/{id}:
    get:
      tags: [Questions]
      summary: Get single question
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Question details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
    put:
      tags: [Questions]
      summary: Update question (admin/teacher)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                topic_id: { type: integer }
                question_text: { type: string }
                option_a: { type: string }
                option_b: { type: string }
                option_c: { type: string }
                option_d: { type: string }
                correct_answer: { type: string, enum: [A, B, C, D] }
                explanation: { type: string }
      responses:
        '200':
          description: Question updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
    delete:
      tags: [Questions]
      summary: Delete question (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Question deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  # ════════════════════════════════════════
  # QUIZ (Student)
  # ════════════════════════════════════════
  /quiz/{topicId}/start:
    post:
      tags: [Quiz]
      summary: Start quiz on a topic
      description: Returns 10 random questions (without correct answers)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: topicId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Quiz questions
          content:
            application/json:
              schema:
                type: object
                properties:
                  topic:
                    type: object
                    properties:
                      id: { type: integer }
                      title: { type: string }
                  questions:
                    type: array
                    items: { $ref: '#/components/schemas/QuestionForQuiz' }

  /quiz/submit:
    post:
      tags: [Quiz]
      summary: Submit quiz answers + get AI diagnosis
      description: Submits answers, calculates score, calls Gemini AI for error diagnosis on wrong answers
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic_id, answers]
              properties:
                topic_id: { type: integer, example: 1 }
                answers:
                  type: array
                  items:
                    type: object
                    required: [question_id, selected_answer]
                    properties:
                      question_id: { type: integer, example: 1 }
                      selected_answer: { type: string, enum: [A, B, C, D], example: "B" }
            example:
              topic_id: 1
              answers:
                - { question_id: 1, selected_answer: "B" }
                - { question_id: 2, selected_answer: "A" }
                - { question_id: 3, selected_answer: "C" }
      responses:
        '200':
          description: Quiz result with AI diagnosis
          content:
            application/json:
              schema:
                type: object
                properties:
                  attempt_id: { type: integer }
                  score: { type: integer }
                  total: { type: integer }
                  diagnosis:
                    type: array
                    nullable: true
                    items: { $ref: '#/components/schemas/DiagnosisItem' }

  /quiz/result/{id}:
    get:
      tags: [Quiz]
      summary: Get detailed quiz result
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Full quiz attempt with answers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizAttempt' }

  /quiz/history:
    get:
      tags: [Quiz]
      summary: Get quiz history (last 20 attempts)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Recent attempts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QuizAttempt' }

  # ════════════════════════════════════════
  # AI FEATURES
  # ════════════════════════════════════════
  /tutor/ask:
    post:
      tags: [AI - Tutor]
      summary: Ask AI tutor a question (RAG-powered)
      description: Uses ChromaDB vector search + Gemini AI to answer questions grounded in DTM content
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, maxLength: 1000, example: "Logarifm xossalarini tushuntiring" }
      responses:
        '200':
          description: AI answer with sources
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TutorResponse' }

  /feynman/evaluate:
    post:
      tags: [AI - Feynman]
      summary: Evaluate student explanation ("Explain It Back")
      description: Student writes their understanding of a topic, AI scores and identifies gaps
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic_id, explanation]
              properties:
                topic_id: { type: integer, example: 1 }
                explanation: { type: string, minLength: 20, example: "Logarifm bu darajaning teskari amali. Masalan log_2(8)=3 chunki 2 ning 3-darajasi 8 ga teng." }
      responses:
        '200':
          description: Evaluation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeynmanResult' }

  /generator/create:
    post:
      tags: [AI - Generator]
      summary: Generate DTM questions from text (teacher tool)
      description: AI generates DTM-format questions from input text. Optionally saves to database.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 50, example: "Logarifm - bu daraja topish amali teskarisi..." }
                count: { type: integer, minimum: 1, maximum: 10, default: 5 }
                topic_id: { type: integer, nullable: true, description: "If provided, saves generated questions to this topic" }
      responses:
        '200':
          description: Generated questions (preview only)
          content:
            application/json:
              schema:
                type: object
                properties:
                  questions:
                    type: array
                    items: { $ref: '#/components/schemas/Question' }
        '201':
          description: Generated and saved to database
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  questions:
                    type: array
                    items: { $ref: '#/components/schemas/Question' }
