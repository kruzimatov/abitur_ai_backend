openapi: 3.0.3
info:
  title: AbiturAI API
  description: AI-powered DTM test prep platform for Uzbek students
  version: 2.0.0

servers:
  - url: http://localhost:8080/api
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        firstname: { type: string }
        lastname: { type: string }
        email: { type: string }
        gender: { type: string, enum: [male, female] }
        role: { type: string, enum: [student, teacher, admin] }
        field_id: { type: integer, nullable: true }
        subject_id: { type: integer, nullable: true }
        field:
          $ref: '#/components/schemas/FieldWithSubjects'
        subject:
          $ref: '#/components/schemas/SubjectShort'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AuthResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string }
        token_type: { type: string, example: bearer }
        expires_in: { type: integer, example: 3600 }

    Field:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FieldWithSubjects:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        subjects:
          type: array
          items: { $ref: '#/components/schemas/SubjectShort' }

    SubjectShort:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }

    Subject:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        topics_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Topic:
      type: object
      properties:
        id: { type: integer }
        subject_id: { type: integer }
        title: { type: string }
        content: { type: string }
        order_num: { type: integer }
        subject:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }

    TopicShort:
      type: object
      properties:
        id: { type: integer }
        subject_id: { type: integer }
        title: { type: string }
        order_num: { type: integer }

    Question:
      type: object
      properties:
        id: { type: integer }
        topic_id: { type: integer }
        question_text: { type: string }
        option_a: { type: string }
        option_b: { type: string }
        option_c: { type: string }
        option_d: { type: string }
        correct_answer: { type: string, enum: [A, B, C, D] }
        explanation: { type: string, nullable: true }

    QuestionForQuiz:
      type: object
      properties:
        id: { type: integer }
        question_text: { type: string }
        option_a: { type: string }
        option_b: { type: string }
        option_c: { type: string }
        option_d: { type: string }

    QuizAttempt:
      type: object
      properties:
        id: { type: integer }
        topic_id: { type: integer }
        score: { type: integer }
        total: { type: integer }
        diagnosis: { type: array, nullable: true, items: { $ref: '#/components/schemas/DiagnosisItem' } }
        completed_at: { type: string, format: date-time, nullable: true }
        topic:
          type: object
          properties:
            id: { type: integer }
            title: { type: string }

    DiagnosisItem:
      type: object
      properties:
        question: { type: string }
        student_answer: { type: string }
        correct_answer: { type: string }
        misconception: { type: string }
        why_student_chose: { type: string }
        correct_reasoning: { type: string }
        tip: { type: string }

    FeynmanResult:
      type: object
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        correct: { type: array, items: { type: string } }
        wrong: { type: array, items: { type: string } }
        missing: { type: array, items: { type: string } }
        feedback: { type: string }

    TutorResponse:
      type: object
      properties:
        answer: { type: string }
        sources: { type: array, items: { type: string } }

    StudentDashboard:
      type: object
      properties:
        total_quizzes: { type: integer }
        avg_score: { type: number }
        subjects_count: { type: integer }
        recent_attempts: { type: array, items: { $ref: '#/components/schemas/QuizAttempt' } }

    AdminDashboard:
      type: object
      properties:
        total_users: { type: integer }
        total_subjects: { type: integer }
        total_topics: { type: integer }
        total_questions: { type: integer }
        total_quiz_attempts: { type: integer }

    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

paths:
  # ════════════════════════════════════════
  # PUBLIC (no auth needed)
  # ════════════════════════════════════════
  /fields:
    get:
      tags: [Public]
      summary: List all fields of study with their subjects
      description: "Used on registration page. Student picks a field → subjects auto-display."
      responses:
        '200':
          description: Fields with subjects
          content:
            application/json:
              example:
                - id: 1
                  name: "Amaliy matematika va kompyuter tahlili"
                  subjects:
                    - { id: 2, name: "Amaliy matematika" }
                    - { id: 3, name: "Fizika" }
                    - { id: 6, name: "Ona tili" }
                    - { id: 7, name: "O'zbekiston Tarixi" }
                    - { id: 1, name: "Matematika" }
                - id: 3
                  name: "Umumiy davolash"
                  subjects:
                    - { id: 4, name: "Kimyo" }
                    - { id: 5, name: "Biologiya" }
                    - { id: 6, name: "Ona tili" }
                    - { id: 7, name: "O'zbekiston Tarixi" }
                    - { id: 1, name: "Matematika" }
              schema:
                type: array
                items: { $ref: '#/components/schemas/FieldWithSubjects' }

  /fields/{id}:
    get:
      tags: [Public]
      summary: Get single field with its subjects
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Field with subjects
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldWithSubjects' }

  # ════════════════════════════════════════
  # AUTH
  # ════════════════════════════════════════
  /auth/register:
    post:
      tags: [Auth]
      summary: Register new student or teacher
      description: |
        **Student registration**: requires field_id (pick from GET /fields)
        **Teacher registration**: requires subject_id (pick from GET /subjects)
        Admin cannot be registered — only seeded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstname, lastname, email, password, password_confirmation, gender, role]
              properties:
                firstname: { type: string, example: "Ali" }
                lastname: { type: string, example: "Valiyev" }
                email: { type: string, example: "ali@example.com" }
                password: { type: string, minLength: 6, example: "password123" }
                password_confirmation: { type: string, example: "password123" }
                gender: { type: string, enum: [male, female], example: "male" }
                role: { type: string, enum: [student, teacher], example: "student" }
                field_id: { type: integer, description: "Required for student (pick from GET /fields)", example: 2 }
                subject_id: { type: integer, description: "Required for teacher (pick from GET /subjects)", example: 1 }
            examples:
              student:
                summary: Student registration
                value:
                  firstname: "Ali"
                  lastname: "Valiyev"
                  email: "ali@example.com"
                  password: "password123"
                  password_confirmation: "password123"
                  gender: "male"
                  role: "student"
                  field_id: 2
              teacher:
                summary: Teacher registration
                value:
                  firstname: "Malika"
                  lastname: "Karimova"
                  email: "malika@example.com"
                  password: "password123"
                  password_confirmation: "password123"
                  gender: "female"
                  role: "teacher"
                  subject_id: 1
      responses:
        '201':
          description: User registered (returns user with field/subjects or subject)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '422':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login (email + password)
      description: Returns JWT token + user with role and field/subject info
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: "student@abiturai.uz" }
                password: { type: string, example: "student123" }
            examples:
              student:
                summary: Login as student
                value: { email: "student@abiturai.uz", password: "student123" }
              teacher:
                summary: Login as teacher
                value: { email: "teacher@abiturai.uz", password: "teacher123" }
              admin:
                summary: Login as admin
                value: { email: "admin@abiturai.uz", password: "admin123" }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '422':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (invalidate token)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Successfully logged out" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh JWT token
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: New token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }

  /user:
    get:
      tags: [Auth]
      summary: Get current user (with field/subjects or subject)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  # ════════════════════════════════════════
  # DASHBOARD
  # ════════════════════════════════════════
  /dashboard/student:
    get:
      tags: [Dashboard]
      summary: Student dashboard stats
      description: "Role: student, teacher, admin"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Student stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentDashboard' }

  /dashboard/admin:
    get:
      tags: [Dashboard]
      summary: Admin dashboard stats
      description: "Role: admin only"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Admin overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDashboard' }
        '403':
          description: Forbidden (not admin)

  # ════════════════════════════════════════
  # SUBJECTS
  # ════════════════════════════════════════
  /subjects:
    get:
      tags: [Subjects]
      summary: List all subjects with topic count
      description: "Role: all authenticated users"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of subjects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Subject' }
    post:
      tags: [Subjects]
      summary: Create subject
      description: "Role: teacher, admin"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "Informatika" }
                description: { type: string, example: "DTM informatika fani" }
      responses:
        '201':
          description: Subject created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subject' }
        '403':
          description: Forbidden

  /subjects/{id}:
    put:
      tags: [Subjects]
      summary: Update subject
      description: "Role: teacher, admin"
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '200':
          description: Subject updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subject' }
    delete:
      tags: [Subjects]
      summary: Delete subject
      description: "Role: admin only"
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Subject deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '403':
          description: Forbidden

  /subjects/{id}/topics:
    get:
      tags: [Subjects]
      summary: List topics in a subject
      description: "Role: all authenticated users"
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Topics list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TopicShort' }

  # ════════════════════════════════════════
  # TOPICS
  # ════════════════════════════════════════
  /topics:
    post:
      tags: [Topics]
      summary: Create topic
      description: "Role: teacher, admin"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_id, title, content]
              properties:
                subject_id: { type: integer, example: 1 }
                title: { type: string, example: "Integrallar" }
                content: { type: string, example: "Integral - hosilaning teskari amali..." }
                order_num: { type: integer, example: 4 }
      responses:
        '201':
          description: Topic created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }

  /topics/{id}:
    get:
      tags: [Topics]
      summary: Get topic content (lesson page)
      description: "Role: all authenticated users"
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Topic with full content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
    put:
      tags: [Topics]
      summary: Update topic
      description: "Role: teacher, admin"
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject_id: { type: integer }
                title: { type: string }
                content: { type: string }
                order_num: { type: integer }
      responses:
        '200':
          description: Topic updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
    delete:
      tags: [Topics]
      summary: Delete topic
      description: "Role: admin only"
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Topic deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  # ════════════════════════════════════════
  # QUESTIONS
  # ════════════════════════════════════════
  /questions:
    get:
      tags: [Questions]
      summary: List questions (paginated, filterable by topic)
      description: "Role: teacher, admin"
      security: [{ bearerAuth: [] }]
      parameters:
        - name: topic_id
          in: query
          schema: { type: integer }
          description: Filter by topic
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: Paginated questions
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_page: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Question' }
                  last_page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
    post:
      tags: [Questions]
      summary: Create question
      description: "Role: teacher, admin"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic_id, question_text, option_a, option_b, option_c, option_d, correct_answer]
              properties:
                topic_id: { type: integer, example: 1 }
                question_text: { type: string, example: "log_2(16) = ?" }
                option_a: { type: string, example: "2" }
                option_b: { type: string, example: "3" }
                option_c: { type: string, example: "4" }
                option_d: { type: string, example: "8" }
                correct_answer: { type: string, enum: [A, B, C, D], example: "C" }
                explanation: { type: string, example: "2^4 = 16" }
      responses:
        '201':
          description: Question created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }

  /questions/{id}:
    get:
      tags: [Questions]
      summary: Get single question
      description: "Role: teacher, admin"
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Question details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
    put:
      tags: [Questions]
      summary: Update question
      description: "Role: teacher, admin"
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                topic_id: { type: integer }
                question_text: { type: string }
                option_a: { type: string }
                option_b: { type: string }
                option_c: { type: string }
                option_d: { type: string }
                correct_answer: { type: string, enum: [A, B, C, D] }
                explanation: { type: string }
      responses:
        '200':
          description: Question updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
    delete:
      tags: [Questions]
      summary: Delete question
      description: "Role: admin only"
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Question deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  # ════════════════════════════════════════
  # QUIZ (Student)
  # ════════════════════════════════════════
  /quiz/{topicId}/start:
    post:
      tags: [Quiz]
      summary: Start quiz on a topic (10 random questions)
      description: "Role: student, teacher, admin. Returns questions WITHOUT correct answers."
      security: [{ bearerAuth: [] }]
      parameters:
        - name: topicId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Quiz questions
          content:
            application/json:
              schema:
                type: object
                properties:
                  topic:
                    type: object
                    properties:
                      id: { type: integer }
                      title: { type: string }
                  questions:
                    type: array
                    items: { $ref: '#/components/schemas/QuestionForQuiz' }

  /quiz/submit:
    post:
      tags: [Quiz]
      summary: Submit quiz answers + get AI diagnosis
      description: "Role: student, teacher, admin. Calculates score + Gemini AI analyzes wrong answers."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic_id, answers]
              properties:
                topic_id: { type: integer, example: 1 }
                answers:
                  type: array
                  items:
                    type: object
                    required: [question_id, selected_answer]
                    properties:
                      question_id: { type: integer, example: 1 }
                      selected_answer: { type: string, enum: [A, B, C, D], example: "B" }
            example:
              topic_id: 1
              answers:
                - { question_id: 1, selected_answer: "B" }
                - { question_id: 2, selected_answer: "A" }
                - { question_id: 3, selected_answer: "C" }
      responses:
        '200':
          description: Quiz result with AI diagnosis
          content:
            application/json:
              schema:
                type: object
                properties:
                  attempt_id: { type: integer }
                  score: { type: integer }
                  total: { type: integer }
                  diagnosis:
                    type: array
                    nullable: true
                    items: { $ref: '#/components/schemas/DiagnosisItem' }

  /quiz/result/{id}:
    get:
      tags: [Quiz]
      summary: Get detailed quiz result with all answers
      description: "Role: student, teacher, admin"
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Full quiz attempt with answers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizAttempt' }

  /quiz/history:
    get:
      tags: [Quiz]
      summary: Get quiz history (last 20 attempts)
      description: "Role: student, teacher, admin"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Recent attempts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QuizAttempt' }

  # ════════════════════════════════════════
  # AI FEATURES
  # ════════════════════════════════════════
  /tutor/ask:
    post:
      tags: [AI Features]
      summary: Ask AI tutor a question (RAG-powered)
      description: "Role: student, teacher, admin. Uses ChromaDB vector search + Gemini AI."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, maxLength: 1000, example: "Logarifm xossalarini tushuntiring" }
      responses:
        '200':
          description: AI answer with sources
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TutorResponse' }

  /feynman/evaluate:
    post:
      tags: [AI Features]
      summary: Evaluate student explanation (Feynman method)
      description: "Role: student, teacher, admin. Student writes their understanding, AI scores it."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic_id, explanation]
              properties:
                topic_id: { type: integer, example: 1 }
                explanation: { type: string, minLength: 20, example: "Logarifm bu darajaning teskari amali. Masalan log_2(8)=3 chunki 2 ning 3-darajasi 8 ga teng." }
      responses:
        '200':
          description: Evaluation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeynmanResult' }

  /generator/create:
    post:
      tags: [AI Features]
      summary: Generate DTM questions from text (teacher tool)
      description: "Role: teacher, admin. AI generates questions. If topic_id given, saves to DB."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 50, example: "Logarifm - bu daraja topish amali teskarisi..." }
                count: { type: integer, minimum: 1, maximum: 10, default: 5 }
                topic_id: { type: integer, nullable: true, description: "If provided, saves generated questions to this topic" }
      responses:
        '200':
          description: Generated questions (preview only)
          content:
            application/json:
              schema:
                type: object
                properties:
                  questions:
                    type: array
                    items: { $ref: '#/components/schemas/Question' }
        '201':
          description: Generated and saved to database
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  questions:
                    type: array
                    items: { $ref: '#/components/schemas/Question' }
